# Gera o APK de teste do Neko G na nuvem (GitHub Actions), sem precisar instalar o Android Studio.
# Como usar: suba o projeto num repositório do GitHub → aba Actions → "APK Android (teste)" → Run workflow.
# Ao terminar, baixe o arquivo em "Artifacts" (neko-g-apk-<número>) e instale no celular.
#
# v0.17 — envios mais eficientes:
#  - só o envio mais recente compila (um envio novo cancela o anterior que ainda estava rodando);
#  - "[skip apk]" na mensagem do commit pula a compilação (ex.: só documentação);
#  - cache do npm e do Gradle (compila mais rápido e depende menos da rede);
#  - etapas que baixam coisas tentam de novo até 3 vezes (as falhas de 08/11 foram tempo esgotado de rede).
name: APK Android (teste)

on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'android-app/**', '.github/workflows/android-apk.yml']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# id-token: o GitHub emite um token que o Google aceita (Federação de identidade, sem chave secreta guardada)
permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('android-app/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar dependências (até 3 tentativas)
        working-directory: android-app
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install falhou (tentativa $i); tentando de novo em 20 s"; sleep 20
          done
          exit 1

      - name: Preparar projeto Android
        working-directory: android-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}   # versionCode do APK (o aviso de atualização compara versões)
        run: npm run prepare:android

      # Chave de teste fixa (a SHA-1 dela está cadastrada no Firebase para o login com Google)
      - name: Chave de teste fixa
        run: mkdir -p ~/.android && cp android-app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK (debug, até 3 tentativas)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          # o download do Gradle tinha limite de 10 s: sobe para 2 min
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle falhou (tentativa $i); tentando de novo em 20 s"; sleep 20
          done
          exit 1

      # Confere a chave do APK (precisa ser a cadastrada no Firebase) e o cliente Web usado no login com Google
      - name: Conferir assinatura e login com Google
        run: |
          APK=$(ls android-app/android/app/build/outputs/apk/debug/*.apk | head -1)
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -i "SHA-1 digest: 18b0078ede440e99407b34156a244837017c34e5" /tmp/certs.txt || { echo "::error::APK assinado com outra chave (SHA-1 diferente da cadastrada no Firebase)"; exit 1; }
          grep -rhoE 'default_web_client_id" translatable="false">[^<]*' android-app/android/app/build/ | sort -u || echo "::warning::default_web_client_id não gerado"

      - uses: actions/upload-artifact@v4
        with:
          name: neko-g-apk-${{ github.run_number }}
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Envia o APK aos testadores (Firebase App Distribution). Eles recebem o aviso e o jogo oferece "Atualizar".
      # Autenticação sem chave: o Google confere que o pedido vem deste repositório (pool "github", provedor "neko-g-actions").
      - name: Autenticar no Google (sem chave)
        id: gauth
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/917194353955/locations/global/workloadIdentityPools/github/providers/neko-g-actions
          service_account: neko-g-ci@neko-g.iam.gserviceaccount.com
          token_format: access_token

      # API REST do App Distribution (o firebase-tools não aceita a credencial sem chave): envia, põe as notas e distribui
      - name: Enviar aos testadores (App Distribution)
        if: github.ref == 'refs/heads/main' && steps.gauth.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.gauth.outputs.access_token }}
          APP: projects/917194353955/apps/1:917194353955:android:16bec733171a0475d6f096
        run: |
          set -e
          API=https://firebaseappdistribution.googleapis.com
          APK=$(ls android-app/android/app/build/outputs/apk/debug/*.apk | head -1)
          VER=$(grep -oE "VERSION = '[^']*'" web/src/config.js | cut -d"'" -f2)
          NOTES=$(printf 'v%s (build %s)\n%s' "$VER" "${{ github.run_number }}" "$(git log -1 --pretty=%B | head -c 2500)")
          OP=$(curl -sS --fail-with-body -X POST "$API/upload/v1/$APP/releases:upload" \
            -H "Authorization: Bearer $TOKEN" -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: neko-g-${{ github.run_number }}.apk" \
            -H "Content-Type: application/octet-stream" --data-binary @"$APK" | jq -r .name)
          echo "operação: $OP"
          REL=""
          for i in $(seq 1 30); do
            R=$(curl -sS --fail-with-body "$API/v1/$OP" -H "Authorization: Bearer $TOKEN")
            if [ "$(echo "$R" | jq -r '.done // false')" = "true" ]; then
              echo "$R" | jq -c '{result: .response.result, error: .error}'
              REL=$(echo "$R" | jq -r '.response.release.name // empty'); break
            fi
            sleep 5
          done
          [ -n "$REL" ] || { echo "::error::envio ao App Distribution não terminou"; exit 1; }
          curl -sS --fail-with-body -X PATCH "$API/v1/$REL?updateMask=release_notes.text" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d "$(jq -n --arg t "$NOTES" '{releaseNotes: {text: $t}}')" > /dev/null
          curl -sS --fail-with-body -X POST "$API/v1/$REL:distribute" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"groupAliases": ["testadores"]}' > /dev/null
          echo "✔ distribuído ao grupo testadores: $REL"
