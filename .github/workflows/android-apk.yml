# Gera o APK de teste do Neko G na nuvem (GitHub Actions), sem precisar instalar o Android Studio.
# Como usar: suba o projeto num repositório do GitHub → aba Actions → "APK Android (teste)" → Run workflow.
# Ao terminar, baixe o arquivo em "Artifacts" (neko-g-apk) e instale no celular.
name: APK Android (teste)

on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'android-app/**', '.github/workflows/android-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: android-app
        run: npm install

      - name: Preparar projeto Android
        working-directory: android-app
        run: npm run prepare:android

      # Chave de teste fixa (a SHA-1 dela está cadastrada no Firebase para o login com Google)
      - name: Chave de teste fixa
        run: mkdir -p ~/.android && cp android-app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK (debug)
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neko-g-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
