# Publica a pasta site/ (wiki do jogo e política de privacidade) no GitHub Pages:
# https://renanxaviier.github.io/neko-g/  ·  política: /privacidade.html  ·  excluir conta: /privacidade.html#excluir
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Segurança: a política só vai ao ar com o e-mail de contato preenchido
      - name: Conferir política de privacidade
        run: |
          if grep -q '{{CONTATO}}' site/privacidade.html 2>/dev/null; then
            rm site/privacidade.html
            echo "::warning::privacidade.html ainda sem e-mail de contato: não publicada"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
